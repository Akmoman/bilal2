        // --- Helper: Grade Sorter ---
        const getGradeValue = (g) => {
            if (!g) return 99;
            const str = g.toString().trim();
            if (str.includes('ثاني عشر') || str.includes('الثاني عشر') || str.match(/\b12\b/)) return 12;
            if (str.includes('حادي عشر') || str.includes('الحادي عشر') || str.match(/\b11\b/)) return 11;
            if (str.includes('عاشر') || str.includes('العاشر') || str.match(/\b10\b/)) return 10;
            if (str.includes('تاسع') || str.includes('التاسع') || str.match(/\b9\b/)) return 9;
            if (str.includes('ثامن') || str.includes('الثامن') || str.match(/\b8\b/)) return 8;
            if (str.includes('سابع') || str.includes('السابع') || str.match(/\b7\b/)) return 7;
            if (str.includes('سادس') || str.includes('السادس') || str.match(/\b6\b/)) return 6;
            if (str.includes('خامس') || str.includes('الخامس') || str.match(/\b5\b/)) return 5;
            return 99;
        };

        const sortGrades = (a, b) => {
            const orderA = getGradeValue(a);
            const orderB = getGradeValue(b);
            
            // ترتيب أساسي بناءً على الصف الدراسي (من الخامس إلى الثاني عشر)
            if (orderA !== orderB) return orderA - orderB;
            
            // إذا كانا في نفس الصف (مثلاً: الخامس 1 والخامس 2)، يتم الترتيب برمجياً بحيث يسبق الرقم 2 الرقم 10
            return (a || '').localeCompare((b || ''), 'ar', { numeric: true });
        };

        const SESSIONS = ["الأولى", "الثانية", "الثالثة", "الرابعة", "الخامسة", "السادسة", "السابعة", "الثامنة"];
        const ADMIN_SESSION = "تصحيح الإدارة";
        const getSessionIndex = (session) => { const idx = SESSIONS.indexOf(session); return idx === -1 ? -1 : idx; };

        const computeDailyStatus = (records) => {
            if (!records || records.length === 0) return null;
            const override = records.find(r => r.session === ADMIN_SESSION);
            if (override) return override.status;
            const sorted = [...records].sort((a, b) => getSessionIndex(a.session) - getSessionIndex(b.session));
            const hasAbsent = sorted.some(r => r.status === 'absent');
            if (!hasAbsent) return sorted[sorted.length - 1].status;
            const last = sorted[sorted.length - 1];
            const earlier = sorted.slice(0, -1);
            if (last.status === 'absent') {
                const wasPresentEarlier = earlier.some(r => r.status === 'present' || r.status === 'late');
                return wasPresentEarlier ? 'runaway' : 'absent';
            }
            const wasAbsentEarlier = earlier.some(r => r.status === 'absent');
            return wasAbsentEarlier ? 'late' : last.status;
        };

        const buildDailyAttendanceMap = (attendanceRecords) => {
            const groups = {};
            attendanceRecords.forEach(r => {
                const key = `${r.date}_${r.studentId}`;
                if (!groups[key]) groups[key] = [];
                groups[key].push(r);
            });
            const daily = {};
            Object.values(groups).forEach(recs => {
                const { date, studentId } = recs[0];
                if (!daily[date]) daily[date] = {};
                daily[date][studentId] = {
                    status: computeDailyStatus(recs),
                    sessionRecords: [...recs].sort((a, b) => getSessionIndex(a.session) - getSessionIndex(b.session))
                };
            });
            return daily;
        };

            const handleSendWhatsApp = (student, date, count) => {
                let phone = student.phone;
                if (!phone) {
                    showDialog({
                        type: 'prompt',

                        onConfirm: (val) => {
                            if (val && val.trim()) {
                                actions.updateStudentPhone(student.id, val.trim());
                                // Retry immediately with the new phone
                                handleSendWhatsApp({ ...student, phone: val.trim() }, date, count);
                            }
                        }
                    });
                    return;
                }
                
                phone = phone.replace(/[^0-9\+]/g, '');
                
                let template = whatsappTemplates.day1;
                if (count == 2) template = whatsappTemplates.day2;
                if (count >= 3) template = whatsappTemplates.day3;

                let msg = template
                    .replace(/\[اسم_الطالب\]/g, student.name)
                    .replace(/\[عدد_الايام\]/g, count)
                    .replace(/\[التاريخ\]/g, date);

                const url = `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
                window.open(url, '_blank');
            };

            const attStatusLabel = { present: 'حاضر', late: 'متأخر', absent: 'غائب', runaway: 'هروب' };
            const SessionDetailChips = ({ records }) => (
                <div className="flex flex-wrap gap-1 justify-end">
                    {(records || []).map((r, i) => (
                        <span key={i} className={`text-[10px] px-1.5 py-0.5 rounded border whitespace-nowrap ${r.status==='absent'?'bg-red-50 text-red-600 border-red-200':r.status==='late'?'bg-amber-50 text-amber-600 border-amber-200':'bg-emerald-50 text-emerald-600 border-emerald-200'}`}>
                            {r.session === ADMIN_SESSION ? 'الإدارة' : r.session} ({r.teacherName || '—'}): {attStatusLabel[r.status] || r.status}
                        </span>
                    ))}
                </div>
            );

            const dailyMap = useMemo(() => buildDailyAttendanceMap(attendanceRecords), [attendanceRecords]);
            
            const studentAbsenceCounts = useMemo(() => {
                const counts = {};
                Object.values(dailyMap).forEach(dayStudents => {
                    Object.entries(dayStudents).forEach(([sid, info]) => {
                        if (info.status === 'absent') counts[sid] = (counts[sid] || 0) + 1;
                    });
                });
                return counts;
            }, [dailyMap]);

            const dailyRowsInRange = useMemo(() => {
                const rows = [];
                Object.entries(dailyMap).forEach(([date, dayStudents]) => {
                    if (date < startDate || date > endDate) return;
                    Object.entries(dayStudents).forEach(([studentId, info]) => {
                        rows.push({ date, studentId, status: info.status, recId: `${date}_${studentId}`, sessionRecords: info.sessionRecords });
                    });
                });
                return rows;
            }, [dailyMap, startDate, endDate]);

            const abs = useMemo(() => dailyRowsInRange.filter(r => r.status === 'absent').map(r => {
                const s = students.find(st => st.id === r.studentId);
                return s ? { ...s, date: r.date, recId: r.recId, sessionRecords: r.sessionRecords } : null;
            }).filter(Boolean).filter(s => grade ? s.grade === grade : true).sort((a, b) => {
                if (a.date !== b.date) return a.date.localeCompare(b.date);
                const gradeDiff = sortGrades(a.grade || '', b.grade || '');
                if (gradeDiff !== 0) return gradeDiff;
                return (a.name || '').localeCompare(b.name || '', 'ar');

                        <button onClick={()=>{window.print()}} className="bg-slate-800 hover:bg-slate-900 text-white px-5 py-2 rounded-lg flex items-center gap-2 font-bold transition-colors"><Icon name="Printer" size={18}/> طباعة</button>

                                            </td>

                                    </div>

                                        <label className="text-sm font-bold text-slate-700 mb-2">2. الصق الأسماء هنا (سطر لكل اسم)</label>
                                        <textarea 
                                            value={importNames} 
                                            onChange={(e) => setImportNames(e.target.value)} 
                                            placeholder="مثال:&#10;أحمد محمد&#10;سعيد علي&#10;خالد حسن" 
                                            className="flex-1 p-3 border border-slate-300 rounded-lg font-mono text-sm focus:ring-2 focus:ring-emerald-500 outline-none resize-none bg-slate-50"
                                        ></textarea>
                                    </div>
                                </div>
                                
                                <div className="bg-blue-50 p-3 rounded-lg text-xs text-blue-800 border border-blue-100 flex items-center gap-2 font-medium">
                                    <Icon name="AlertCircle" size={16} /> تأكد من أن ترتيب الأسماء يطابق ترتيب أرقام الملفات.
                                </div>

                                <div className="flex justify-end gap-3 pt-4 border-t">
                                    <button onClick={() => setShowImport(false)} className="px-6 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg font-medium transition-colors">إلغاء</button>
                                    <button onClick={handleBulkImport} className="px-6 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-bold transition-colors">حفظ القائمة</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="bg-white p-6 rounded-xl shadow-sm border print:hidden">
                        <div className="flex gap-4 items-end mb-4 flex-wrap md:flex-nowrap">
                            <div className="flex-1 w-full md:w-auto">
                                <label className="text-xs font-bold text-slate-600 mb-1 block">رقم الملف (كلمة المرور للدخول)</label>
                                <input value={fileNumber} onChange={(e)=>setFileNumber(e.target.value)} className="w-full p-2.5 border rounded outline-none focus:ring-2 focus:ring-emerald-500" placeholder="مثال: 1234"/>
                            </div>
                            <div className="flex-1 w-full md:w-auto">
                                <label className="text-xs font-bold text-slate-600 mb-1 block">اسم المعلم (اختياري)</label>
                                <input value={name} onChange={(e)=>setName(e.target.value)} className="w-full p-2.5 border rounded outline-none focus:ring-2 focus:ring-emerald-500" placeholder="الاسم"/>
                            </div>
                            <button onClick={add} className="bg-emerald-600 hover:bg-emerald-700 transition-colors text-white px-6 py-2 rounded-lg font-bold h-11 w-full md:w-auto whitespace-nowrap shadow-sm">إضافة صلاحية</button>
                        </div>
                    </div>

                    <div className="bg-white rounded-xl shadow-sm border overflow-hidden">
                        <div className="p-4 border-b border-slate-200 bg-slate-50 font-bold text-slate-700">المعلمين المصرح لهم ({teachers.length})</div>
                        <div className="divide-y divide-slate-100">
                            {teachers.length === 0 ? <div className="p-8 text-center text-slate-400 font-medium">لا يوجد معلمين مسجلين</div> : 
                            teachers.map(t => (
                                <div key={t.id} className="p-4 flex justify-between items-center hover:bg-slate-50 transition-colors">
                                    <div>
                                        <div className="font-bold flex items-center gap-2 text-slate-800"><Icon name="Key" size={16} className="text-emerald-500"/> {t.id}</div>
                                        <div className="text-sm text-slate-500">{t.name}</div>
                                    </div>
                                    <button onClick={()=>del(t.id)} className="text-slate-300 hover:text-red-500 hover:bg-red-50 p-2 rounded-full transition-colors print:hidden"><Icon name="Trash2" size={18}/></button>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        });

        const AttendanceView = memo(({ students, attendanceRecords, userRole, teacherState, setTeacherState, actions, showDialog }) => {
            const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
            const [search, setSearch] = useState('');
            const uniqueGrades = useMemo(() => [...new Set(students.map(s => s.grade || 'غير محدد'))].sort(sortGrades), [students]);

            const dailyMap = useMemo(() => buildDailyAttendanceMap(attendanceRecords), [attendanceRecords]);
            const dayData = dailyMap[date] || {};
            const localAttendance = useMemo(() => {
                const m = {};
                Object.entries(dayData).forEach(([sid, info]) => { m[sid] = info.status; });
                return m;
            }, [dayData]);

            const isComplete = Boolean(teacherState.name?.trim() && teacherState.grade && teacherState.session);
            const canMark = userRole === 'admin' || isComplete;
            const currentSession = userRole === 'admin' ? ADMIN_SESSION : teacherState.session;

            const filtered = useMemo(() => { if (userRole === 'teacher' && !teacherState.grade) return []; return students.filter(s => s.name.includes(search) && (teacherState.grade ? s.grade === teacherState.grade : true)); }, [students, search, teacherState.grade, userRole]);

            const gradeSessionsRecorded = useMemo(() => {
                if (!teacherState.grade) return [];
                const bySession = {};
                attendanceRecords.forEach(r => {
                    if (r.date === date && r.grade === teacherState.grade && r.session && r.session !== ADMIN_SESSION && !bySession[r.session]) {
                        bySession[r.session] = r.teacherName;
                    }
                });
                return SESSIONS.filter(s => bySession[s]).map(s => ({ session: s, teacherName: bySession[s] }));
            }, [date, teacherState.grade, attendanceRecords]);

            const update = async (student, status) => {
                if (!canMark) { showDialog({type:'alert', message:"الرجاء تعبئة اسم المعلم والحصة والصف أولاً لتفعيل الرصد"}); return; }
                try {
                    await actions.updateAttendance(`${date}_${student.id}_${currentSession}`, { date, studentId: student.id, status, teacherName: teacherState.name || 'الإدارة', grade: student.grade, session: currentSession });
                } catch (e) { console.error('Attendance update failed', e); }
            };
            const batch = async (status) => {
                if (!canMark || !filtered.length) return;
                const items = filtered.map(s => ({ id: `${date}_${s.id}_${currentSession}`, data: { date, studentId: s.id, status, teacherName: teacherState.name || 'الإدارة', grade: s.grade, session: currentSession } }));
                try { await actions.batchAttendance(items); } catch (e) { console.error('Batch attendance failed', e); }
            };
            const copy = () => { 
                if (!isComplete) return showDialog({type:'alert', message:"يرجى إكمال جميع بيانات (المعلم، الصف، الحصة) للنسخ."}); 
                const ids = new Set(filtered.map(s => s.id)); 
                const abs = students.filter(s => ids.has(s.id) && localAttendance[s.id] === 'absent'); 
                const lat = students.filter(s => ids.has(s.id) && localAttendance[s.id] === 'late'); 
                const run = students.filter(s => ids.has(s.id) && localAttendance[s.id] === 'runaway'); 
                const t = `*مدرسة بلال بن رباح*\nالتاريخ: ${date}\nالمعلم: ${teacherState.name}\nالصف: ${teacherState.grade}\nالحصة: ${teacherState.session}\n\n🛑 *غياب (${abs.length}):*\n${abs.map(s => s.name).join('\n') || 'لا يوجد'}\n\n⚠️ *تأخير (${lat.length}):*\n${lat.map(s => s.name).join('\n') || 'لا يوجد'}\n\n🏃 *هروب (${run.length}):*\n${run.map(s => s.name).join('\n') || 'لا يوجد'}`; 
                const el = document.createElement('textarea'); el.value = t; document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el); 
                showDialog({type:'alert', message:"تم نسخ التقرير للحافظة بنجاح"}); 
            };

            const statusLabel = { present: 'حاضر', late: 'متأخر', absent: 'غائب', runaway: 'هروب' };

            return (
                <div className="space-y-6">
                    {userRole === 'teacher' && <div className="bg-white p-5 rounded-xl shadow-sm border border-emerald-100 grid grid-cols-1 md:grid-cols-2 gap-4"><div><label className="text-xs font-bold text-slate-700 block mb-1">المعلم *</label><input value={teacherState.name} onChange={(e)=>setTeacherState(p=>({...p,name:e.target.value}))} className="w-full p-2.5 border rounded-lg outline-none focus:ring-2 focus:ring-emerald-500" placeholder="اكتب اسمك"/></div><div><label className="text-xs font-bold text-slate-700 block mb-1">الحصة *</label><select value={teacherState.session} onChange={(e)=>setTeacherState(p=>({...p,session:e.target.value}))} className="w-full p-2.5 border rounded-lg outline-none focus:ring-2 focus:ring-emerald-500 bg-white"><option value="">اختر</option>{SESSIONS.map(s=><option key={s} value={s}>{s}</option>)}</select></div></div>}
                    
                    <div className="flex justify-between gap-2 items-center flex-wrap">
                        <h2 className="text-2xl font-bold text-slate-800">رصد الغياب</h2>
                        <div className="flex gap-2">
                            <input type="date" value={date} onChange={(e)=>setDate(e.target.value)} className="p-2 border rounded-lg outline-none focus:ring-2 focus:ring-emerald-500 bg-white shadow-sm"/>
                            {userRole==='teacher'&&<button onClick={copy} disabled={!isComplete} className={`px-4 py-2 rounded-lg text-white font-bold transition-colors shadow-sm ${!isComplete?'bg-slate-300':'bg-emerald-600 hover:bg-emerald-700'}`}><Icon name="FileSpreadsheet" size={18} className="inline mr-1"/> نسخ</button>}
                        </div>
                    </div>

                    {teacherState.grade && (
                        <div className="bg-blue-50 border-r-4 border-blue-400 p-4 rounded-xl shadow-sm flex items-start gap-3 mb-4">
                            <Icon name="ClipboardList" className="text-blue-500 mt-1 flex-shrink-0" />
                            <div className="flex-1">
                                <p className="font-bold text-blue-800">الحصص المرصودة اليوم لهذا الصف ({gradeSessionsRecorded.length} من {SESSIONS.length})</p>
                                {gradeSessionsRecorded.length > 0 ? (
                                    <div className="flex flex-wrap gap-2 mt-2">
                                        {gradeSessionsRecorded.map(g => (
                                            <span key={g.session} className={`text-xs px-2.5 py-1 rounded-full border font-bold ${g.session === teacherState.session ? 'bg-emerald-100 text-emerald-700 border-emerald-300' : 'bg-white text-blue-700 border-blue-200 shadow-sm'}`}>
                                                {g.session}: {g.teacherName}
                                            </span>
                                        ))}
                                    </div>
                                ) : <p className="text-sm text-blue-700 mt-1">لم يتم رصد أي حصة بعد لهذا الصف اليوم.</p>}
                            </div>
                        </div>
                    )}

                    <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex gap-4 items-center sticky top-0 z-10 print:hidden flex-wrap md:flex-nowrap">
                        <select value={teacherState.grade} onChange={(e)=>setTeacherState(p=>({...p,grade:e.target.value}))} className="p-2.5 border rounded-lg w-full md:w-1/4 outline-none focus:ring-2 focus:ring-emerald-500 bg-white font-bold text-slate-700">
                            <option value="">{userRole==='teacher'?'اختر الصف *':'الكل'}</option>
                            {uniqueGrades.map(g=><option key={g} value={g}>{g}</option>)}
                        </select>
                        <div className="relative flex-1 w-full"><input placeholder="بحث عن طالب..." value={search} onChange={(e)=>setSearch(e.target.value)} className="w-full p-2.5 pr-9 border rounded-lg outline-none focus:ring-2 focus:ring-emerald-500"/><div className="absolute right-3 top-3 text-slate-400"><Icon name="Search" size={18}/></div></div>
                        <div className="flex gap-2 w-full md:w-auto justify-end">
                            <button onClick={()=>batch('present')} disabled={!canMark} className="px-4 py-2 bg-emerald-100 text-emerald-700 rounded-lg font-bold cursor-pointer hover:bg-emerald-200 transition-colors shadow-sm flex-1 md:flex-auto">تحضير للكل</button>
                            <button onClick={()=>batch('absent')} disabled={!canMark} className="px-4 py-2 bg-red-100 text-red-700 rounded-lg font-bold cursor-pointer hover:bg-red-200 transition-colors shadow-sm flex-1 md:flex-auto">تغييب للكل</button>
                        </div>
                    </div>
                    
                    <div className="bg-white rounded-xl shadow-sm border overflow-hidden">
                        <div className="divide-y divide-slate-100">
                            {filtered.length===0 ? <div className="p-10 text-center text-slate-400 font-bold">لا يوجد طلاب متطابقين أو لم يتم تحديد صف</div> : filtered.map(s => {
                                const info = dayData[s.id];
                                const finalStatus = info?.status;
                                const returned = finalStatus === 'late' && info?.sessionRecords?.some(r => r.status === 'absent');
                                return (
                                    <div key={s.id} className={`p-4 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 transition-colors ${finalStatus==='absent'?'bg-red-50/60':finalStatus==='runaway'?'bg-orange-50/60':finalStatus==='late'?'bg-amber-50/60':'hover:bg-slate-50'}`}>
                                        <div className="flex-1 min-w-0 w-full">
                                            <div className="font-bold flex items-center gap-2 flex-wrap text-slate-800 text-base mb-1">
                                                {s.name}
                                                {finalStatus==='absent' && <span className="text-[10px] bg-red-100 text-red-700 px-2 py-0.5 rounded-full border border-red-200 font-bold">غياب يوم كامل</span>}
                                                {finalStatus==='runaway' && <span className="text-[10px] bg-orange-100 text-orange-700 px-2 py-0.5 rounded-full border border-orange-200 font-bold">🏃 هروب</span>}
                                                {returned && <span className="text-[10px] bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full border border-amber-200 font-bold">متأخر - عاد</span>}
                                            </div>
                                            <div className="text-xs text-slate-500 mb-2">{s.grade}</div>
                                            {info?.sessionRecords?.length > 0 && (
                                                <div className="flex flex-wrap gap-1">
                                                    {info.sessionRecords.map(r => (
                                                        <span key={r.session} className={`text-[10px] px-2 py-0.5 rounded-full border ${r.status==='absent'?'bg-red-50 text-red-600 border-red-200 font-medium':r.status==='late'?'bg-amber-50 text-amber-700 border-amber-200 font-medium':'bg-emerald-50 text-emerald-600 border-emerald-200'}`}>
                                                            {r.session === ADMIN_SESSION ? 'الإدارة' : r.session}: {statusLabel[r.status]}
                                                        </span>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                        <div className="flex gap-2 flex-shrink-0 w-full md:w-auto bg-slate-100/50 p-1 rounded-lg self-end md:self-auto border border-slate-100">
                                            {['present','late','absent'].map(st=>(
                                                <button key={st} onClick={()=>update(s,st)} disabled={!canMark} className={`p-2.5 md:p-2 rounded-md border flex-1 md:flex-none flex justify-center cursor-pointer transition-all shadow-sm transform active:scale-95 ${(finalStatus===st||(finalStatus==='runaway'&&st==='absent'))?(st==='present'?'bg-emerald-600 border-emerald-700 text-white':st==='late'?'bg-amber-500 border-amber-600 text-white':finalStatus==='runaway'?'bg-orange-500 border-orange-600 text-white':'bg-red-500 border-red-600 text-white'):'bg-white border-slate-200 text-slate-400 hover:bg-slate-50'}`}>
                                                    <Icon name={st==='present'?'CheckCircle':st==='late'?'Clock':'XCircle'} size={20}/>
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        });

        const isQuizWindowOpen = (win) => win && win.isOpen === true;
        const getActiveQuizTag = (quizWindows) => {
            if (isQuizWindowOpen(quizWindows?.quiz1)) return 'quiz1';
            if (isQuizWindowOpen(quizWindows?.quiz2)) return 'quiz2';
            return null;
        };
        const QUIZ_LABEL = { quiz1: 'الاختبار القصير الأول', quiz2: 'الاختبار القصير الثاني' };

        const ExcellenceView = memo(({ students, userRole, teacherState, setTeacherState, excellenceRecords, actions, isExcellenceLocked, quizWindows, showDialog }) => {
            const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
            const [search, setSearch] = useState('');
            const subjects = ["التربية الإسلامية", "اللغة العربية", "الرياضيات", "العلوم", "اللغة الإنجليزية", "الدراسات الاجتماعية", "تقنية المعلومات", "الرياضة المدرسية", "الفنون التشكيلية", "الموسيقى", "المهارات الحياتية", "التاريخ", "الجغرافيا", "الفيزياء", "الكيمياء", "الأحياء"];
            const uniqueGrades = useMemo(() => [...new Set(students.map(s => s.grade || 'غير محدد'))].sort(sortGrades), [students]);
            
            const excellenceData = useMemo(() => { 
                const d={}; 
                excellenceRecords.forEach(r => {
                    d[`${r.date}_${r.subject}_${r.studentId}`] = true;
                    if (r.id) d[r.id] = true;
                }); 
                return d; 
            }, [excellenceRecords]);

            const filtered = useMemo(() => { 
                if (!teacherState.grade) return []; 
                return students.filter(s => s.name.includes(search) && s.grade === teacherState.grade); 
            }, [students, search, teacherState.grade]);

            const isAdmin = userRole === 'admin';
            const activeQuiz = getActiveQuizTag(quizWindows);
            const isQuizActive = Boolean(quizWindows?.quiz1?.isOpen || quizWindows?.quiz2?.isOpen);
            const canMark = isAdmin || (!isExcellenceLocked) || isQuizActive;

            const toggle = async (sid) => {
                if (!canMark) return showDialog({type:'alert', message:"رصد المجيدين مقفل حالياً من قبل الإدارة"});
                const teacherName = (teacherState.name || '').trim();
                if (!teacherName || !teacherState.grade || !teacherState.subject) return showDialog({type:'alert', message:"الرجاء تحديد (اسم المعلم والصف والمادة) أولاً لتفعيل رصد النجمة"});
                const key = `${date}_${teacherState.subject}_${sid}`;
                const exists = !!excellenceData[key];
                const student = students.find(s => s.id === sid);
                try {
                    await actions.toggleExcellence(key, { 
                        date, studentId: sid, studentName: student ? student.name : '', 
                        grade: teacherState.grade, subject: teacherState.subject, teacherName: teacherName, 
                        quiz: exists ? null : activeQuiz 
                    }, exists);
                } catch(e) { console.error(e); }
            };

            return (
                <div className="space-y-6">
                    {isAdmin && (
                        <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-4 print:hidden">
                            <div className="flex justify-between items-center border-b pb-4 flex-wrap gap-2">
                                <div><h3 className="font-bold text-slate-800 text-base">لوحة تحكم رصد المجيدين</h3><p className="text-xs text-slate-500 mt-1">إدارة أوقات رصد النقاط والنجوم</p></div>
                                <button onClick={actions.toggleExcellenceLock} className={`px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2 transition-all shadow-sm ${!isExcellenceLocked ? 'bg-emerald-600 text-white hover:bg-emerald-700' : 'bg-red-600 text-white hover:bg-red-700'}`}><Icon name={!isExcellenceLocked ? "UnlockKeyhole" : "LockKeyhole"} size={18} />{!isExcellenceLocked ? 'الرصد العام متاح (اضغط للقفل)' : 'الرصد العام مقفل (اضغط للفتح)'}</button>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {['quiz1','quiz2'].map(q => {
                                    const open = isQuizWindowOpen(quizWindows?.[q]);
                                    return (
                                        <div key={q} className={`p-4 rounded-xl border flex items-center justify-between transition-colors ${open ? 'bg-emerald-50 border-emerald-300' : 'bg-slate-50 border-slate-200'}`}>
                                            <div className="flex items-center gap-3">
                                                <div className={`p-2.5 rounded-full ${open ? 'bg-emerald-100 text-emerald-600' : 'bg-slate-200 text-slate-500'}`}><Icon name={open ? "UnlockKeyhole" : "LockKeyhole"} size={20} /></div>
                                                <div><div className="font-bold text-slate-800">{QUIZ_LABEL[q]}</div><div className={`text-xs mt-0.5 ${open ? 'text-emerald-700 font-bold' : 'text-slate-500'}`}>{open ? 'مفتوح للرصد الآن' : 'مغلق'}</div></div>
                                            </div>
                                            <button onClick={() => actions.toggleQuizStatus(q)} className={`px-4 py-2 rounded-lg font-bold text-sm transition-colors shadow-sm ${open ? 'bg-red-100 text-red-700 hover:bg-red-200 border border-red-200' : 'bg-emerald-600 text-white hover:bg-emerald-700'}`}>{open ? 'إغلاق الرصد' : 'فتح الرصد'}</button>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    )}

                    {!isAdmin && (
                        canMark ? (
                            <div className="p-4 rounded-xl border bg-emerald-50 border-emerald-200 flex items-center gap-3 text-emerald-800 print:hidden shadow-sm"><Icon name="UnlockKeyhole" size={24} className="text-emerald-600 flex-shrink-0" /><p className="font-bold text-sm">صلاحية رصد المجيدين متاحة حالياً {activeQuiz ? `(فترة ${QUIZ_LABEL[activeQuiz]})` : '(الرصد العام)'}</p></div>
                        ) : (
                            <div className="p-4 rounded-xl border bg-red-50 border-red-200 flex items-center gap-3 text-red-800 print:hidden shadow-sm"><Icon name="LockKeyhole" size={24} className="text-red-600 flex-shrink-0" /><p className="font-bold text-sm">رصد المجيدين مقفل حالياً من قبل الإدارة. يرجى مراجعة إدارة المدرسة لفتح الصلاحية.</p></div>
                        )
                    )}

                    <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 grid grid-cols-1 md:grid-cols-3 gap-5 print:hidden">
                        <div><label className="text-xs font-bold text-slate-700 mb-1.5 block">اسم المعلم *</label><input value={teacherState.name} onChange={(e)=>setTeacherState(p=>({...p,name:e.target.value}))} className="w-full p-2.5 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-emerald-500 bg-slate-50 focus:bg-white transition-colors" placeholder="اكتب اسمك هنا"/></div>
                        <div><label className="text-xs font-bold text-slate-700 mb-1.5 block">المادة *</label><select value={teacherState.subject} onChange={(e)=>setTeacherState(p=>({...p,subject:e.target.value}))} className="w-full p-2.5 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-emerald-500 bg-slate-50 focus:bg-white transition-colors"><option value="">اختر المادة</option>{subjects.map(s=><option key={s} value={s}>{s}</option>)}</select></div>
                        <div><label className="text-xs font-bold text-slate-700 mb-1.5 block">التاريخ</label><input type="date" value={date} onChange={(e)=>setDate(e.target.value)} className="w-full p-2.5 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-emerald-500 bg-slate-50 focus:bg-white transition-colors"/></div>
                    </div>

                    <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap md:flex-nowrap gap-4 items-center sticky top-0 z-10 print:hidden">
                        <select value={teacherState.grade} onChange={(e)=>setTeacherState(p=>({...p,grade:e.target.value}))} className="p-2.5 border border-slate-300 rounded-lg w-full md:w-1/3 bg-slate-50 focus:bg-white outline-none focus:ring-2 focus:ring-emerald-500 font-bold transition-colors"><option value="">{userRole==='teacher'?'اختر الصف *':'كل الصفوف'}</option>{uniqueGrades.map(g=><option key={g} value={g}>{g}</option>)}</select>
                        <div className="relative flex-1 w-full"><input placeholder="بحث عن اسم الطالب..." value={search} onChange={(e)=>setSearch(e.target.value)} className="w-full p-2.5 pr-10 border border-slate-300 rounded-lg bg-slate-50 focus:bg-white outline-none focus:ring-2 focus:ring-emerald-500 transition-colors"/><div className="absolute right-3 top-3 text-slate-400"><Icon name="Search" size={20}/></div></div>
                    </div>

                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div className="divide-y divide-slate-100">
                            {!teacherState.grade || !teacherState.subject ? (
                                <div className="p-12 text-center text-slate-400 font-bold flex flex-col items-center gap-3 print:hidden"><Icon name="Star" size={48} className="text-slate-200" /><span>الرجاء اختيار (الصف والمادة) من الأعلى لبدء رصد المجيدين</span></div>
                            ) : filtered.length === 0 ? (
                                <div className="p-10 text-center text-slate-400 print:hidden font-medium">لا يوجد طلاب مطابقين للبحث</div>
                            ) : (
                                filtered.map(s => {
                                    const isExcellence = !!excellenceData[`${date}_${teacherState.subject}_${s.id}`];
                                    return (
                                        <div key={s.id} className={`p-4 flex justify-between items-center transition-colors ${isExcellence ? 'bg-amber-50/80' : 'hover:bg-slate-50'}`}>
                                            <div><div className="font-bold text-slate-800 text-base mb-1">{s.name}</div><div className="text-xs text-slate-400">{s.grade}</div></div>
                                            <button onClick={() => toggle(s.id)} disabled={!canMark} title={!canMark ? "الرصد مقفل" : isExcellence ? "إلغاء الإجادة" : "رصد إجادة"} className={`p-3 rounded-full transition-all active:scale-95 shadow-sm ${!canMark ? 'opacity-30 cursor-not-allowed text-slate-400 bg-slate-100' : 'cursor-pointer'} ${isExcellence ? 'text-amber-500 bg-white border border-amber-200 hover:scale-110 shadow-md' : 'text-slate-300 bg-white border border-slate-100 hover:text-amber-400 hover:border-amber-200 hover:bg-amber-50'} print:hidden`}><Icon name="Star" size={28} fill={isExcellence ? "currentColor" : "none"} /></button>
                                        </div>
                                    );
                                })
                            )}
                        </div>
                    </div>
                </div>
            );
        });

        const defaultTemplates = {
            day1: "المكرم ولي أمر الطالب [اسم_الطالب]، نود إبلاغكم بغياب ابنكم اليوم [التاريخ]. يرجى متابعة الأمر. إدارة مدرسة بلال بن رباح.",
            day2: "المكرم ولي أمر الطالب [اسم_الطالب]، نود إبلاغكم بغياب ابنكم لمدة يومين متتاليين. نرجو توضيح سبب الغياب. إدارة مدرسة بلال بن رباح.",
            day3: "تحذير: المكرم ولي أمر الطالب [اسم_الطالب]، تجاوز غياب ابنكم 3 أيام (الغياب الحالي: [عدد_الايام] أيام). يرجى مراجعة إدارة مدرسة بلال بن رباح فوراً لتجنب الإجراءات الإدارية."
        };

        const SchoolAttendanceApp = () => {
            const [firebaseReady, setFirebaseReady] = useState(false);
            const [user, setUser] = useState(null);
            const [userRole, setUserRole] = useState(null);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [students, setStudents] = useState([]);
            const [teachers, setTeachers] = useState([]);
            const [attendanceRecords, setAttendanceRecords] = useState([]);
            const [excellenceRecords, setExcellenceRecords] = useState([]);
            const [loading, setLoading] = useState(true);
            const [newsText, setNewsText] = useState('');
            const [teacherState, setTeacherState] = useState({ name: '', grade: '', session: '', subject: '' });
            const [authError, setAuthError] = useState(null);
            const [isOffline, setIsOffline] = useState(false);
            const [dbError, setDbError] = useState(null);
            const [saveStatus, setSaveStatus] = useState('');
            const [isExcellenceLocked, setIsExcellenceLocked] = useState(false);
            const [quizWindows, setQuizWindows] = useState({ quiz1: { isOpen: false }, quiz2: { isOpen: false } });
            const [whatsappTemplates, setWhatsappTemplates] = useState(defaultTemplates);
            
            // Custom Dialog State
            const [dialog, setDialog] = useState(null);

            useEffect(() => {
                if (window.AppFirebase) setFirebaseReady(true);
                else window.addEventListener('firebase-ready', () => setFirebaseReady(true));
            }, []);

            useEffect(() => {
                if (!firebaseReady) return;
                const { auth, signInAnonymously } = window.AppFirebase;
                const timer = setTimeout(() => { if(loading) setLoading(false); }, 4000);
                
                if (auth && signInAnonymously) {
                    signInAnonymously(auth).catch(err => {
                        console.error(err);
                        setAuthError("تنبيه: خدمة الدخول السحابية غير مفعلة. يعمل الآن في الوضع المحلي."); 
                        setIsOffline(true); 
                        setUser({uid:'offline', isAnonymous:true});
                    });
                }
                return () => clearTimeout(timer);
            }, [firebaseReady]);
            
            useEffect(() => {
                 if (!firebaseReady) return;
                 const { auth, onAuthStateChanged } = window.AppFirebase;
                 if (auth && onAuthStateChanged) {
                    return onAuthStateChanged(auth, (u) => { if(!isOffline) setUser(u); });
                 }
            }, [firebaseReady, isOffline]);

            useEffect(() => {
                if (!user) return;
                if (isOffline) {
                    setStudents(JSON.parse(localStorage.getItem('students')||'[]'));
                    setTeachers(JSON.parse(localStorage.getItem('teachers')||'[]'));
                    setAttendanceRecords(JSON.parse(localStorage.getItem('attendance')||'[]'));
                    setExcellenceRecords(JSON.parse(localStorage.getItem('excellence')||'[]'));
                    setWhatsappTemplates(JSON.parse(localStorage.getItem('waTemplates')||JSON.stringify(defaultTemplates)));
                    setQuizWindows(JSON.parse(localStorage.getItem('quizWindows')||'{"quiz1":{"isOpen":false},"quiz2":{"isOpen":false}}'));
                    setIsExcellenceLocked(JSON.parse(localStorage.getItem('excellenceLocked')||'false'));
                    setLoading(false); return;
                }
                const { db, collection, onSnapshot, doc } = window.AppFirebase;
                const u1 = onSnapshot(collection(db,'artifacts',appId,'public','data','students'), s => setStudents(s.docs.map(d=>({id:d.id,...d.data()}))));
                const u2 = onSnapshot(collection(db,'artifacts',appId,'public','data','attendance'), s => setAttendanceRecords(s.docs.map(d=>({id:d.id,...d.data()}))));
                const u3 = onSnapshot(collection(db,'artifacts',appId,'public','data','excellence'), s => setExcellenceRecords(s.docs.map(d=>({id:d.id,...d.data()}))));
                const u5 = onSnapshot(collection(db,'artifacts',appId,'public','data','teachers'), s => setTeachers(s.docs.map(d=>({id:d.id,...d.data()}))));
                const u4 = onSnapshot(doc(db,'artifacts',appId,'public','data','settings','config'), s => {
                    if (s.exists()) {
                        const data = s.data();
                        setNewsText(data.newsText || '');
                        if(data.whatsappTemplates) setWhatsappTemplates(data.whatsappTemplates);
                        setIsExcellenceLocked(!!data.excellenceLocked);
                        setQuizWindows(data.quizWindows || { quiz1: { isOpen: false }, quiz2: { isOpen: false } });
                    }
                    setLoading(false);
                });
                
                return () => { u1(); u2(); u3(); u4(); u5(); };
            }, [user, isOffline]);

            const handleLogin = (role, password = "") => {
                if (role === 'admin' && password === 'akm1983') { setUserRole('admin'); setActiveTab('dashboard'); } 
                else if (role === 'teacher') { setUserRole('teacher'); setActiveTab('attendance'); }
                else setDialog({ type: 'alert', message: 'كلمة المرور خاطئة' });
            };

            const handleTeacherLogin = (fileNumber) => {
                const teacher = teachers.find(t => t.id.toString().trim() === fileNumber.toString().trim());
                if (teacher) {
                    setUserRole('teacher');
                    setActiveTab('attendance');
                    const teacherDisplayName = (teacher.name && teacher.name !== 'معلم') ? teacher.name : '';
                    setTeacherState(prev => ({ ...prev, name: teacherDisplayName }));
                } else {
                    setDialog({ type: 'alert', message: 'رقم الملف غير مسجل في النظام كمعلم.' });
                }
            };

            const handleLogout = () => {
                setUserRole(null);
                setActiveTab('dashboard');
                setTeacherState({ name: '', grade: '', session: '', subject: '' });
            };

            const showDialogBox = useCallback((config) => {
                setDialog(config);
            }, []);

            const closeDialogBox = useCallback(() => {
                setDialog(null);
            }, []);

            const withSaveStatus = async (promise) => {
                setSaveStatus('saving');
                try { await promise; setSaveStatus('success'); setTimeout(() => setSaveStatus(''), 2000); } 
                catch (e) { setSaveStatus('error'); console.error(e); setTimeout(() => setSaveStatus(''), 3000); throw e; }
            };

            const actions = useMemo(() => ({
                addStudent: async (d) => {
                    const s = {id:Date.now().toString(), ...d};
                    if(isOffline){ const n=[...students,s]; setStudents(n); localStorage.setItem('students',JSON.stringify(n)); return; }
                    const {db,collection,doc,setDoc,serverTimestamp} = window.AppFirebase; 
                    await withSaveStatus(setDoc(doc(collection(db,'artifacts',appId,'public','data','students')), {...d, createdAt: serverTimestamp()}));
                },
                updateStudentPhone: async (id, phone) => {
                    if(isOffline){ 
                        const n = students.map(s => s.id === id ? {...s, phone} : s);
                        setStudents(n); localStorage.setItem('students',JSON.stringify(n)); return; 
                    }
                    const {db,doc,updateDoc} = window.AppFirebase; 
                    await updateDoc(doc(db,'artifacts',appId,'public','data','students', id), { phone });
                },
                batchAdd: async (list) => {
                    if(isOffline) { const n=[...students, ...list.map(i=>({id:Math.random().toString(),...i}))]; setStudents(n); localStorage.setItem('students',JSON.stringify(n)); return; }
                    const {db,collection,doc,writeBatch,serverTimestamp} = window.AppFirebase;
                    const batch = writeBatch(db);
                    list.forEach(i => batch.set(doc(collection(db,'artifacts',appId,'public','data','students')), {...i, createdAt: serverTimestamp()}));
                    await withSaveStatus(batch.commit());
                },
                deleteStudent: async (id) => {
                    if(isOffline){ setStudents(students.filter(s=>s.id!==id)); return; }
                    const {db,doc,deleteDoc} = window.AppFirebase; await withSaveStatus(deleteDoc(doc(db,'artifacts',appId,'public','data','students',id)));
                },
                batchDelete: async (list) => {
                    if(isOffline) return;
                    const {db,doc,writeBatch} = window.AppFirebase;
                    const batch = writeBatch(db);
                    list.forEach(s => batch.delete(doc(db,'artifacts',appId,'public','data','students',s.id)));
                    await batch.commit();
                },
                updateWhatsAppTemplates: async (templates) => {
                    setWhatsappTemplates(templates);
                    if(isOffline) { localStorage.setItem('waTemplates', JSON.stringify(templates)); return; }
                    const {db,doc,setDoc} = window.AppFirebase; 
                    await withSaveStatus(setDoc(doc(db,'artifacts',appId,'public','data','settings','config'), {whatsappTemplates: templates}, {merge:true}));
                },
                updateNews: async (t) => {
                    if(isOffline) return;
                    const {db,doc,setDoc} = window.AppFirebase; await setDoc(doc(db,'artifacts',appId,'public','data','settings','config'), {newsText:t}, {merge:true});
                },
                deleteAllAttendance: () => {
                    showDialogBox({
                        type: 'confirm',
                        message: "هل أنت متأكد من مسح جميع سجلات الغياب؟ لا يمكن التراجع عن هذا الإجراء وسيتم حذف جميع الإحصائيات الحالية للغياب.",
                        onConfirm: async () => {
                            if (isOffline) { setAttendanceRecords([]); localStorage.setItem('attendance', '[]'); return; }
                            const { db, doc, writeBatch } = window.AppFirebase;
                            const list = attendanceRecords;
                            const batchSize = 400;
                            setSaveStatus('saving');
                            try {
                                for (let i = 0; i < list.length; i += batchSize) {
                                    const batch = writeBatch(db);
                                    list.slice(i, i + batchSize).forEach(r => batch.delete(doc(db, 'artifacts', appId, 'public', 'data', 'attendance', r.id)));
                                    await batch.commit();
                                }
                                setSaveStatus('success'); setTimeout(() => setSaveStatus(''), 2000);
                            } catch (e) { console.error(e); setSaveStatus('error'); }
                        }
                    });
                },
                factoryReset: () => {
                    showDialogBox({
                        type: 'prompt',
                        message: "تحذير خطير جداً: سيتم مسح قاعدة البيانات بالكامل (الطلاب، المعلمين، الحضور، الغياب، المجيدين).\nهذا الإجراء يُنصح به للبدء بعام دراسي جديد ولتسريع النظام عن طريق إزالة البيانات القديمة.\n\nللتأكيد، اكتب كلمة: 'مسح_الكل' بالأسفل.",
                        onConfirm: async (val) => {
                            if (val !== 'مسح_الكل') {
                                showDialogBox({ type: 'alert', message: 'تم إلغاء عملية إعادة الضبط لأن الكلمة المدخلة غير متطابقة.' });
                                return;
                            }
                            if (isOffline) {
                                localStorage.clear();
                                window.location.reload();
                                return;
                            }
                            setSaveStatus('saving');
                            const { db, doc, writeBatch } = window.AppFirebase;
                            try {
                                const batchSize = 400;
                                const collectionsToClear = [
                                    { name: 'attendance', data: attendanceRecords },
                                    { name: 'excellence', data: excellenceRecords },
                                    { name: 'students', data: students },
                                    { name: 'teachers', data: teachers }
                                ];
                                
                                // Process deletion sequentially to avoid overwhelming the browser
                                for (const col of collectionsToClear) {
                                    for (let i = 0; i < col.data.length; i += batchSize) {
                                        const batch = writeBatch(db);
                                        col.data.slice(i, i + batchSize).forEach(r => batch.delete(doc(db, 'artifacts', appId, 'public', 'data', col.name, r.id)));
                                        await batch.commit();
                                    }
                                }
                                
                                setSaveStatus('success');
                                showDialogBox({ type: 'alert', message: "تمت إعادة الضبط المصنعي بنجاح. النظام الآن فارغ وجاهز للعمل بشكل أسرع بكثير." });
                                setTimeout(() => setSaveStatus(''), 2000);
                            } catch (e) {
                                console.error(e);
                                setSaveStatus('error');
                                showDialogBox({ type: 'alert', message: "حدث خطأ أثناء تفريغ البيانات." });
                            }
                        }
                    });
                },
                updateAttendance: async (did, d) => {
                    if(isOffline){ const n=[...attendanceRecords.filter(r=>r.id!==did),{...d,id:did}]; setAttendanceRecords(n); localStorage.setItem('attendance',JSON.stringify(n)); return; }
                    const {db,doc,setDoc,serverTimestamp} = window.AppFirebase;
                    await withSaveStatus(setDoc(doc(db,'artifacts',appId,'public','data','attendance',did), {...d, updatedAt: serverTimestamp()}));
                },
                batchAttendance: async (list) => {
                    if(isOffline) { const n = [...attendanceRecords]; list.forEach(i=>{ const idx=n.findIndex(r=>r.id===i.id); if(idx>-1)n[idx]={...i.data,id:i.id}; else n.push({...i.data,id:i.id}); }); setAttendanceRecords(n); localStorage.setItem('attendance',JSON.stringify(n)); return; }
                    const {db,doc,writeBatch,serverTimestamp} = window.AppFirebase;
                    const batch = writeBatch(db);
                    list.forEach(i => batch.set(doc(db,'artifacts',appId,'public','data','attendance',i.id), {...i.data, updatedAt: serverTimestamp()}));
                    await withSaveStatus(batch.commit());
                },
                toggleExcellence: async (did, d, exists) => {
                    if(isOffline){ 
                        let n; if(exists) n=excellenceRecords.filter(r=>`${r.date}_${r.subject}_${r.studentId}`!==did && r.id!==did); else n=[...excellenceRecords,{...d,id:did}]; 
                        setExcellenceRecords(n); localStorage.setItem('excellence',JSON.stringify(n)); return; 
                    }
                    const {db,doc,setDoc,deleteDoc,serverTimestamp} = window.AppFirebase; 
                    const ref = doc(db,'artifacts',appId,'public','data','excellence',did); 
                    if(exists) await withSaveStatus(deleteDoc(ref)); else await withSaveStatus(setDoc(ref, {...d, createdAt: serverTimestamp()}));
                },
                toggleQuizStatus: async (quiz) => {
                    const current = quizWindows?.[quiz]?.isOpen || false;
                    const newWindows = { ...quizWindows, [quiz]: { isOpen: !current } };
                    setQuizWindows(newWindows);
                    if (isOffline) { localStorage.setItem('quizWindows', JSON.stringify(newWindows)); return; }
                    const { db, doc, setDoc } = window.AppFirebase;
                    await withSaveStatus(setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'config'), { quizWindows: newWindows }, { merge: true }));
                },
                toggleExcellenceLock: async () => {
                    const newVal = !isExcellenceLocked;
                    setIsExcellenceLocked(newVal);
                    if (isOffline) { localStorage.setItem('excellenceLocked', JSON.stringify(newVal)); return; }
                    const { db, doc, setDoc } = window.AppFirebase;
                    await withSaveStatus(setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'config'), { excellenceLocked: newVal }, { merge: true }));
                },
                addTeacher: async (t) => {
                    if(isOffline) return showDialogBox({type:'alert', message:"هذه الخاصية غير متاحة في الوضع المحلي"});
                    const {db,doc,setDoc,serverTimestamp} = window.AppFirebase; 
                    await withSaveStatus(setDoc(doc(db,'artifacts',appId,'public','data','teachers', t.id), {...t, createdAt: serverTimestamp()}));
                },
                batchAddTeachers: async (list) => {
                    if(isOffline) return showDialogBox({type:'alert', message:"هذه الخاصية غير متاحة في الوضع المحلي"});
                    const {db,doc,writeBatch,serverTimestamp} = window.AppFirebase;
                    const batch = writeBatch(db);
                    list.forEach(t => batch.set(doc(db,'artifacts',appId,'public','data','teachers', t.id), { id: t.id, name: t.name, createdAt: serverTimestamp() }));
                    await withSaveStatus(batch.commit());
                },
                deleteTeacher: async (id) => {
                    if(isOffline) return;
                    const {db,doc,deleteDoc} = window.AppFirebase; 
                    await withSaveStatus(deleteDoc(doc(db,'artifacts',appId,'public','data','teachers', id)));
                },
                batchDeleteTeachers: async (list) => {
                     if(isOffline) return;
                     const {db,doc,writeBatch} = window.AppFirebase;
                     const batch = writeBatch(db);
                     list.forEach(t => batch.delete(doc(db,'artifacts',appId,'public','data','teachers', t.id)));
                     await withSaveStatus(batch.commit());
                }
            }), [isOffline, students, attendanceRecords, excellenceRecords, teachers, appId, quizWindows, isExcellenceLocked, showDialogBox]);

            const sortedStudents = useMemo(() => {
                return [...students].sort((a, b) => {
                    const gradeDiff = sortGrades(a.grade || '', b.grade || '');
                    if (gradeDiff !== 0) return gradeDiff;
                    return (a.name || '').localeCompare(b.name || '', 'ar');
                });
            }, [students]);

            if (!firebaseReady || (user && loading)) return <div className="min-h-screen flex flex-col items-center justify-center bg-slate-50 text-slate-500 gap-4"><div className="animate-spin rounded-full h-12 w-12 border-b-4 border-emerald-600 shadow-md"></div><span className="font-bold">جاري تحميل النظام...</span></div>;
            if (!userRole) return <><LoginScreen onLogin={handleLogin} onTeacherLogin={handleTeacherLogin} newsText={newsText} showDialog={showDialogBox}/><GlobalDialog dialog={dialog} closeDialog={closeDialogBox} /></>;

            return (
                <div className="flex flex-col md:flex-row min-h-screen bg-slate-50 font-sans print:block print:h-auto print:overflow-visible print:bg-white selection:bg-emerald-100" dir="rtl">
                    <Sidebar activeTab={activeTab} setActiveTab={setActiveTab} userRole={userRole} onLogout={handleLogout} dbError={dbError} studentsCount={students.length} />
                    <main className="flex-1 p-4 md:p-8 overflow-y-auto h-screen relative flex flex-col print:h-auto print:overflow-visible print:block print:p-0">
                        <div className="absolute top-4 left-4 z-50 flex gap-2 print:hidden">
                            {saveStatus === 'saving' && <span className="bg-blue-100 text-blue-700 px-4 py-1.5 rounded-full text-xs font-bold flex items-center gap-1.5 animate-pulse shadow-sm border border-blue-200"><Icon name="UploadCloud" size={14}/> جاري الحفظ...</span>}
                            {saveStatus === 'success' && <span className="bg-emerald-100 text-emerald-700 px-4 py-1.5 rounded-full text-xs font-bold flex items-center gap-1.5 shadow-sm border border-emerald-200"><Icon name="CheckCircle" size={14}/> تم الحفظ بنجاح</span>}
                            {saveStatus === 'error' && <span className="bg-red-100 text-red-700 px-4 py-1.5 rounded-full text-xs font-bold flex items-center gap-1.5 shadow-sm border border-red-200"><Icon name="XCircle" size={14}/> فشل الحفظ</span>}
                        </div>

                        {authError && <div className="mb-4 p-4 bg-amber-50 border border-amber-200 rounded-xl text-amber-800 text-sm font-bold flex items-center gap-2 shadow-sm print:hidden"><Icon name="AlertCircle" size={20}/> {authError}</div>}
                        {dbError && <div className="mb-4 p-4 bg-red-50 border border-red-200 rounded-xl text-red-800 text-sm font-bold flex items-center gap-2 shadow-sm print:hidden"><Icon name="WifiOff" size={20}/> {dbError}</div>}

                        <NewsTicker text={newsText} />
                        
                        <div className="max-w-6xl mx-auto flex-1 w-full mt-6 print:mt-0 print:max-w-none">
                            {activeTab === 'dashboard' && userRole === 'admin' && <DashboardView students={sortedStudents} attendanceRecords={attendanceRecords} newsText={newsText} actions={actions} isExcellenceLocked={isExcellenceLocked} quizWindows={quizWindows} whatsappTemplates={whatsappTemplates} showDialog={showDialogBox} />}
                            {activeTab === 'students' && userRole === 'admin' && <StudentsView students={sortedStudents} actions={actions} showDialog={showDialogBox} />} 
                            {activeTab === 'attendance' && <AttendanceView students={sortedStudents} attendanceRecords={attendanceRecords} userRole={userRole} teacherState={teacherState} setTeacherState={setTeacherState} actions={actions} showDialog={showDialogBox} />}
                            {activeTab === 'excellence' && <ExcellenceView students={sortedStudents} userRole={userRole} teacherState={teacherState} setTeacherState={setTeacherState} excellenceRecords={excellenceRecords} actions={actions} isExcellenceLocked={isExcellenceLocked} quizWindows={quizWindows} showDialog={showDialogBox} />}
                            {activeTab === 'reports' && userRole === 'admin' && <ReportsView students={sortedStudents} attendanceRecords={attendanceRecords} excellenceRecords={excellenceRecords} actions={actions} whatsappTemplates={whatsappTemplates} showDialog={showDialogBox} />}
                            {activeTab === 'teachers' && userRole === 'admin' && <TeachersManagerView teachers={teachers} actions={actions} showDialog={showDialogBox} />}
                        </div>
                    </main>
                    <GlobalDialog dialog={dialog} closeDialog={closeDialogBox} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SchoolAttendanceApp />);
    </script>
</body>
</html>

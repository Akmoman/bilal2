        const gradeOrder = {
            'الخامس': 5, 'خامس': 5, '5': 5,
            'السادس': 6, 'سادس': 6, '6': 6,
            'السابع': 7, 'سابع': 7, '7': 7,
            'الثامن': 8, 'ثامن': 8, '8': 8,
            'التاسع': 9, 'تاسع': 9, '9': 9,
            'العاشر': 10, 'عاشر': 10, '10': 10,
            'الحادي عشر': 11, 'حادي عشر': 11, '11': 11,
            'الثاني عشر': 12, 'ثاني عشر': 12, '12': 12
        };

        const sortGrades = (a, b) => {
            const getBaseGrade = (g) => { if (!g) return ''; return g.split('/')[0].trim(); };
            const orderA = gradeOrder[getBaseGrade(a)] || 99;
            const orderB = gradeOrder[getBaseGrade(b)] || 99;
            if (orderA !== orderB) return orderA - orderB;
            return a.localeCompare(b, 'ar');
        };

        const SESSIONS = ["الأولى", "الثانية", "الثالثة", "الرابعة", "الخامسة", "السادسة", "السابعة", "الثامنة"];
        const ADMIN_SESSION = "تصحيح الإدارة";
        const getSessionIndex = (session) => { const idx = SESSIONS.indexOf(session); return idx === -1 ? -1 : idx; };

        const computeDailyStatus = (records) => {
            if (!records || records.length === 0) return null;
            const override = records.find(r => r.session === ADMIN_SESSION);
            if (override) return override.status;
            const sorted = [...records].sort((a, b) => getSessionIndex(a.session) - getSessionIndex(b.session));
            const hasAbsent = sorted.some(r => r.status === 'absent');
            if (!hasAbsent) return sorted[sorted.length - 1].status;
            const last = sorted[sorted.length - 1];
            const earlier = sorted.slice(0, -1);
            if (last.status === 'absent') {
                const wasPresentEarlier = earlier.some(r => r.status === 'present' || r.status === 'late');
                return wasPresentEarlier ? 'runaway' : 'absent';
            }
            const wasAbsentEarlier = earlier.some(r => r.status === 'absent');
            return wasAbsentEarlier ? 'late' : last.status;
        };

        const buildDailyAttendanceMap = (attendanceRecords) => {
            const groups = {};
            attendanceRecords.forEach(r => {
                const key = `${r.date}_${r.studentId}`;
                if (!groups[key]) groups[key] = [];
                groups[key].push(r);
            });
            const daily = {};
            Object.values(groups).forEach(recs => {
                const { date, studentId } = recs[0];
                if (!daily[date]) daily[date] = {};
                daily[date][studentId] = {
                    status: computeDailyStatus(recs),
                    sessionRecords: [...recs].sort((a, b) => getSessionIndex(a.session) - getSessionIndex(b.session))
                };
            });
            return daily;
        };

        const DashboardView = memo(({ students, attendanceRecords, newsText, actions, isExcellenceLocked, quizWindows, whatsappTemplates }) => {
            const today = new Date().toISOString().split('T')[0];
            const [isEditingNews, setIsEditingNews] = useState(false);
            const [tempNews, setTempNews] = useState(newsText || "");
            const [showWASettings, setShowWASettings] = useState(false);

            useEffect(() => setTempNews(newsText || ""), [newsText]);

            const dailyMap = useMemo(() => buildDailyAttendanceMap(attendanceRecords), [attendanceRecords]);

            const stats = useMemo(() => {
                const todayData = dailyMap[today] || {};
                const statuses = Object.values(todayData).map(i => i.status);
                const total = students.length;
                const present = statuses.filter(s => s === 'present').length;
                const absent = statuses.filter(s => s === 'absent').length;
                const late = statuses.filter(s => s === 'late').length;
                const runaway = statuses.filter(s => s === 'runaway').length;
                const rate = total > 0 ? Math.round((present / total) * 100) : 0;
                return { total, present, absent, late, runaway, rate };
            }, [students, dailyMap, today]);

            const missingAttendanceGrades = useMemo(() => {
                const allGrades = [...new Set(students.map(s => s.grade))].filter(g => g && g !== 'غير محدد').sort(sortGrades);
                const recordedGrades = new Set(attendanceRecords.filter(r => r.date === today).map(r => r.grade));
                return allGrades.filter(g => !recordedGrades.has(g));
            }, [students, attendanceRecords]);

            const handleSaveNews = async () => { try { await actions.updateNews(tempNews); setIsEditingNews(false); alert('تم التحديث'); } catch (e) { alert('خطأ'); } };
            const topTeachers = useMemo(() => { const stats = {}; attendanceRecords.forEach(r => { if (r.teacherName && typeof r.teacherName === 'string' && r.teacherName.trim()) { const n = r.teacherName.trim(); stats[n] = (stats[n] || 0) + 1; } }); return Object.entries(stats).sort(([, a], [, b]) => b - a).slice(0, 5); }, [attendanceRecords]);
            const mostAbsentStudents = useMemo(() => { const stats = {}; Object.values(dailyMap).forEach(dayStudents => { Object.entries(dayStudents).forEach(([sid, info]) => { if (info.status === 'absent') stats[sid] = (stats[sid] || 0) + 1; }); }); return Object.entries(stats).sort(([, a], [, b]) => b - a).slice(0, 5).map(([id, c]) => { const s = students.find(s => s.id === id); return s ? { ...s, count: c } : null; }).filter(Boolean); }, [dailyMap, students]);

            const isQuizActive = Boolean(quizWindows?.quiz1?.isOpen || quizWindows?.quiz2?.isOpen);
            const isMarkingOpenForTeachers = !isExcellenceLocked || isQuizActive;

            const Stat = ({ title, value, color, iconName }) => (<div className={`${color} text-white p-6 rounded-xl shadow-md flex justify-between items-center`}><div><p className="text-sm opacity-90 mb-1">{title}</p><p className="text-3xl font-bold">{value}</p></div><div className="opacity-20 transform scale-150"><Icon name={iconName} size={24} /></div></div>);

            return (
                <div className="space-y-6 animate-in fade-in duration-500">
                    {showWASettings && <WhatsAppSettingsModal templates={whatsappTemplates} onClose={() => setShowWASettings(false)} onSave={actions.updateWhatsAppTemplates} />}
                    
                    <div className="flex justify-between items-center flex-wrap gap-4 print:hidden">

                                <Icon name={!isExcellenceLocked ? "UnlockKeyhole" : "LockKeyhole"} size={20} /> {!isExcellenceLocked ? 'صلاحية المجيدين: مفعلة ومتاحة' : 'صلاحية المجيدين: مقفلة'}
                            </button>
                            <button onClick={actions.deleteAllAttendance} className="bg-red-100 text-red-600 px-4 py-2 rounded-lg font-bold flex items-center gap-2 hover:bg-red-200 transition-colors"><Icon name="Trash2" size={20} /> تصفير سجلات الغياب</button>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4 mb-8"><Stat title="إجمالي الطلاب" value={stats.total} color="bg-blue-500" iconName="Users" /><Stat title="نسبة الحضور" value={`${stats.rate}%`} color="bg-emerald-500" iconName="CheckCircle" /><Stat title="الغياب اليوم" value={stats.absent} color="bg-red-500" iconName="XCircle" /><Stat title="التأخير اليوم" value={stats.late} color="bg-amber-500" iconName="Clock" /><Stat title="الهروب اليوم" value={stats.runaway} color="bg-orange-500" iconName="AlertCircle" /></div>
                    
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-orange-100 mb-6 print:hidden">

                        {missingAttendanceGrades.length > 0 ? (<div className="flex flex-wrap gap-2 max-h-32 overflow-y-auto">{missingAttendanceGrades.map(g => (<span key={g} className="bg-orange-50 text-orange-800 px-3 py-1 rounded-lg text-sm border border-orange-200 font-bold">{g}</span>))}</div>) : (<div className="flex items-center gap-2 text-emerald-600 bg-emerald-50 p-3 rounded-lg border border-emerald-100"><Icon name="CheckCircle" size={18} /><span className="font-bold text-sm">ممتاز! تم رصد الغياب لجميع الصفوف اليوم.</span></div>)}

                        {isEditingNews ? (<div className="flex flex-col gap-2"><textarea value={tempNews} onChange={(e) => setTempNews(e.target.value)} className="w-full p-2 border rounded" /><div className="flex gap-2 justify-end"><button onClick={() => setIsEditingNews(false)} className="bg-slate-200 px-4 py-2 rounded">إلغاء</button><button onClick={handleSaveNews} className="bg-emerald-600 text-white px-4 py-2 rounded">حفظ</button></div></div>) : (<div className="bg-slate-50 p-4 rounded-lg text-center">{newsText || "لا يوجد إعلان."}</div>)}

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div className="bg-white p-6 rounded-xl shadow-sm border h-full"><h3 className="font-bold text-slate-800 flex items-center gap-2 mb-4"><Icon name="Award" className="text-yellow-500" size={24} /> المعلمين الأكثر نشاطاً</h3><div className="space-y-3">{topTeachers.map(([n, c], i) => (<div key={n} className="flex justify-between p-3 bg-slate-50 rounded border hover:bg-blue-50"><span className="font-bold">{i+1}. {n}</span><span className="text-xs bg-white px-2 py-1 rounded border">{c} عملية</span></div>))}</div></div>
                        <div className="bg-white p-6 rounded-xl shadow-sm border h-full"><h3 className="font-bold text-slate-800 flex items-center gap-2 mb-4"><Icon name="UserMinus" className="text-red-500" size={24} /> الطلاب الأكثر غياباً</h3><div className="space-y-3">{mostAbsentStudents.map((s, i) => (<div key={s.id} className="flex justify-between p-3 bg-red-50 rounded border hover:bg-red-100"><div className="font-bold">{i+1}. {s.name} <span className="text-xs font-normal">({s.grade})</span></div><span className="text-xs bg-white px-3 py-1 rounded border font-bold text-red-600">{s.count} أيام</span></div>))}</div></div>
                    </div>
                </div>
            );
        });

        const StudentsView = memo(({ students, actions }) => {
            const [newName, setNewName] = useState('');
            const [newGrade, setNewGrade] = useState('');
            const [newPhone, setNewPhone] = useState('');
            const [filterGrade, setFilterGrade] = useState('');
            const [showImport, setShowImport] = useState(false);
            const [showDelAll, setShowDelAll] = useState(false);
            const [showDelGrade, setShowDelGrade] = useState(false);
            const [importText, setImportText] = useState('');
            const [bulkGrade, setBulkGrade] = useState('');
            const [gradeToDelete, setGradeToDelete] = useState('');
            const [processing, setProcessing] = useState(false);

            const uniqueGrades = useMemo(() => [...new Set(students.map(s => s.grade || 'غير محدد'))].sort(sortGrades), [students]);
            
            const displayedStudents = useMemo(() => {
                if (!filterGrade) return students;
                return students.filter(s => s.grade === filterGrade);
            }, [students, filterGrade]);

            const add = async (e) => { e.preventDefault(); if(!newName.trim()) return; await actions.addStudent({ name: newName, grade: newGrade || 'غير محدد', phone: newPhone }); setNewName(''); setNewGrade(''); setNewPhone(''); };
            const del = async (id) => { if(confirm('حذف؟')) await actions.deleteStudent(id); };
            
            const delAll = async () => { setProcessing(true); try { await actions.batchDelete(students); setShowDelAll(false); } catch(e) { console.error(e); } setProcessing(false); };
            const delGrade = async () => { if(!gradeToDelete) return; setProcessing(true); try { await actions.batchDelete(students.filter(s => s.grade === gradeToDelete)); setShowDelGrade(false); setGradeToDelete(''); } catch(e) { console.error(e); } setProcessing(false); };
            
            const bulkImport = async () => {
                if(!importText.trim()) return;
                setProcessing(true);
                try {
                    const lines = importText.split('\n').filter(l => l.trim());
                    const toAdd = lines.map(l => {
                        const p = l.includes(',') ? l.split(',') : l.includes('\t') ? l.split('\t') : [l];
                        return { name: p[0].trim(), grade: p[1]?.trim() || bulkGrade || 'غير محدد', phone: p[2]?.trim() || '' };
                    }).filter(s => s.name);
                    await actions.batchAdd(toAdd);
                    setImportText(''); setBulkGrade(''); setShowImport(false); alert(`تم إضافة ${toAdd.length} طالب`);
                } catch(e) { console.error(e); alert('خطأ'); }
                setProcessing(false);
            };

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center"><h2 className="text-2xl font-bold text-slate-800">إدارة الطلاب</h2></div>

            const localAttendance = useMemo(() => {

            const filtered = useMemo(() => { if (userRole === 'teacher' && !teacherState.grade) return []; return students.filter(s => s.name.includes(search) && (teacherState.grade ? s.grade === teacherState.grade : true)); }, [students, search, teacherState.grade, userRole]);

                attendanceRecords.forEach(r => {

                        bySession[r.session] = r.teacherName;

                });
                return SESSIONS.filter(s => bySession[s]).map(s => ({ session: s, teacherName: bySession[s] }));

                    await actions.updateAttendance(`${date}_${student.id}_${currentSession}`, { date, studentId: student.id, status, teacherName: teacherState.name || 'الإدارة', grade: student.grade, session: currentSession });

        const isQuizWindowOpen = (win) => win && win.isOpen === true;

        const ExcellenceView = memo(({ students, userRole, teacherState, setTeacherState, excellenceRecords, actions, isExcellenceLocked, quizWindows }) => {

            const uniqueGrades = useMemo(() => [...new Set(students.map(s => s.grade || 'غير محدد'))].sort(sortGrades), [students]);
            
            const excellenceData = useMemo(() => {

                const key = `${date}_${teacherState.subject}_${sid}`;

            day2: "المكرم ولي أمر الطالب [اسم_الطالب]، نود إبلاغكم بغياب ابنكم لمدة يومين متتاليين. نرجو توضيح سبب الغياب. إدارة مدرسة بلال بن رباح.",
            day3: "تحذير: المكرم ولي أمر الطالب [اسم_الطالب]، تجاوز غياب ابنكم 3 أيام (الغياب الحالي: [عدد_الايام] أيام). يرجى مراجعة إدارة مدرسة بلال بن رباح فوراً لتجنب الإجراءات الإدارية."

                }
                return () => clearTimeout(timer);
            }, [firebaseReady]);
            
            useEffect(() => {
                 if (!firebaseReady) return;
                 const { auth, onAuthStateChanged } = window.AppFirebase;
                 if (auth && onAuthStateChanged) {

            useEffect(() => {
                if (!user) return;
                if (isOffline) {
                    setStudents(JSON.parse(localStorage.getItem('students')||'[]'));
                    setTeachers(JSON.parse(localStorage.getItem('teachers')||'[]'));
                    setAttendanceRecords(JSON.parse(localStorage.getItem('attendance')||'[]'));
                    setExcellenceRecords(JSON.parse(localStorage.getItem('excellence')||'[]'));
                    setWhatsappTemplates(JSON.parse(localStorage.getItem('waTemplates')||JSON.stringify(defaultTemplates)));
                    setQuizWindows(JSON.parse(localStorage.getItem('quizWindows')||'{"quiz1":{"isOpen":false},"quiz2":{"isOpen":false}}'));
                    setIsExcellenceLocked(JSON.parse(localStorage.getItem('excellenceLocked')||'false'));
                    setLoading(false); return;
                }
                const { db, collection, onSnapshot, doc } = window.AppFirebase;
                const u1 = onSnapshot(collection(db,'artifacts',appId,'public','data','students'), s => setStudents(s.docs.map(d=>({id:d.id,...d.data()}))));
                const u2 = onSnapshot(collection(db,'artifacts',appId,'public','data','attendance'), s => setAttendanceRecords(s.docs.map(d=>({id:d.id,...d.data()}))));
                const u3 = onSnapshot(collection(db,'artifacts',appId,'public','data','excellence'), s => setExcellenceRecords(s.docs.map(d=>({id:d.id,...d.data()}))));
                const u5 = onSnapshot(collection(db,'artifacts',appId,'public','data','teachers'), s => setTeachers(s.docs.map(d=>({id:d.id,...d.data()}))));
                const u4 = onSnapshot(doc(db,'artifacts',appId,'public','data','settings','config'), s => {
                    if (s.exists()) {
                        const data = s.data();
                        setNewsText(data.newsText || '');
                        if(data.whatsappTemplates) setWhatsappTemplates(data.whatsappTemplates);
                        setIsExcellenceLocked(!!data.excellenceLocked);
                        setQuizWindows(data.quizWindows || { quiz1: { isOpen: false }, quiz2: { isOpen: false } });
                    }
                    setLoading(false);
                });
                
                return () => { u1(); u2(); u3(); u4(); u5(); };
            }, [user, isOffline]);

            const handleLogin = (role, password = "") => {
                if (role === 'admin' && password === 'akm1983') { setUserRole('admin'); setActiveTab('dashboard'); } 
                else if (role === 'teacher') { setUserRole('teacher'); setActiveTab('attendance'); }
                else alert('كلمة المرور خاطئة');

            const handleTeacherLogin = (fileNumber) => {
                const teacher = teachers.find(t => t.id.toString().trim() === fileNumber.toString().trim());

            const handleLogout = () => {

            const withSaveStatus = async (promise) => {
                setSaveStatus('saving');
                try { await promise; setSaveStatus('success'); setTimeout(() => setSaveStatus(''), 2000); } 
                catch (e) { setSaveStatus('error'); console.error(e); setTimeout(() => setSaveStatus(''), 3000); throw e; }
            };

            const actions = {
                addStudent: async (d) => {
                    const s = {id:Date.now().toString(), ...d};
                    if(isOffline){ const n=[...students,s]; setStudents(n); localStorage.setItem('students',JSON.stringify(n)); return; }
                    const {db,collection,doc,setDoc,serverTimestamp} = window.AppFirebase; 
                    await withSaveStatus(setDoc(doc(collection(db,'artifacts',appId,'public','data','students')), {...d, createdAt: serverTimestamp()}));
                },
                updateStudentPhone: async (id, phone) => {
                    if(isOffline){ 
                        const n = students.map(s => s.id === id ? {...s, phone} : s);
                        setStudents(n); localStorage.setItem('students',JSON.stringify(n)); return; 
                    }
                    const {db,doc,updateDoc} = window.AppFirebase; 
                    await updateDoc(doc(db,'artifacts',appId,'public','data','students', id), { phone });
                },
                batchAdd: async (list) => {
                    if(isOffline) { const n=[...students, ...list.map(i=>({id:Math.random().toString(),...i}))]; setStudents(n); localStorage.setItem('students',JSON.stringify(n)); return; }
                    const {db,collection,doc,writeBatch,serverTimestamp} = window.AppFirebase;
                    const batch = writeBatch(db);
                    list.forEach(i => batch.set(doc(collection(db,'artifacts',appId,'public','data','students')), {...i, createdAt: serverTimestamp()}));
                    await withSaveStatus(batch.commit());
                },
                deleteStudent: async (id) => {
                    if(isOffline){ setStudents(students.filter(s=>s.id!==id)); return; }
                    const {db,doc,deleteDoc} = window.AppFirebase; await withSaveStatus(deleteDoc(doc(db,'artifacts',appId,'public','data','students',id)));
                },
                batchDelete: async (list) => {
                    if(isOffline) return;
                    const {db,doc,writeBatch} = window.AppFirebase;
                    const batch = writeBatch(db);
                    list.forEach(s => batch.delete(doc(db,'artifacts',appId,'public','data','students',s.id)));
                    await batch.commit();
                },
                updateWhatsAppTemplates: async (templates) => {
                    setWhatsappTemplates(templates);
                    if(isOffline) { localStorage.setItem('waTemplates', JSON.stringify(templates)); return; }
                    const {db,doc,setDoc} = window.AppFirebase; 
                    await withSaveStatus(setDoc(doc(db,'artifacts',appId,'public','data','settings','config'), {whatsappTemplates: templates}, {merge:true}));
                },
                updateNews: async (t) => {
                    if(isOffline) return;
                    const {db,doc,setDoc} = window.AppFirebase; await setDoc(doc(db,'artifacts',appId,'public','data','settings','config'), {newsText:t}, {merge:true});
                },
                deleteAllAttendance: async () => {
                    if (!confirm("هل أنت متأكد من مسح جميع سجلات الغياب؟ لا يمكن التراجع عن هذا الإجراء.")) return;
                    if (isOffline) { setAttendanceRecords([]); localStorage.setItem('attendance', '[]'); return; }
                    const { db, doc, writeBatch } = window.AppFirebase;
                    const list = attendanceRecords;
                    const batchSize = 400;
                    setSaveStatus('saving');
                    try {
                        for (let i = 0; i < list.length; i += batchSize) {
                            const batch = writeBatch(db);
                            list.slice(i, i + batchSize).forEach(r => batch.delete(doc(db, 'artifacts', appId, 'public', 'data', 'attendance', r.id)));
                            await batch.commit();
                        }
                        setSaveStatus('success'); setTimeout(() => setSaveStatus(''), 2000);
                    } catch (e) { console.error(e); setSaveStatus('error'); }
                },
                updateAttendance: async (did, d) => {
                    if(isOffline){ const n=[...attendanceRecords.filter(r=>r.id!==did),{...d,id:did}]; setAttendanceRecords(n); localStorage.setItem('attendance',JSON.stringify(n)); return; }
                    const {db,doc,setDoc,serverTimestamp} = window.AppFirebase;
                    await withSaveStatus(setDoc(doc(db,'artifacts',appId,'public','data','attendance',did), {...d, updatedAt: serverTimestamp()}));
                },
                batchAttendance: async (list) => {
                    if(isOffline) { const n = [...attendanceRecords]; list.forEach(i=>{ const idx=n.findIndex(r=>r.id===i.id); if(idx>-1)n[idx]={...i.data,id:i.id}; else n.push({...i.data,id:i.id}); }); setAttendanceRecords(n); localStorage.setItem('attendance',JSON.stringify(n)); return; }
                    const {db,doc,writeBatch,serverTimestamp} = window.AppFirebase;
                    const batch = writeBatch(db);
                    list.forEach(i => batch.set(doc(db,'artifacts',appId,'public','data','attendance',i.id), {...i.data, updatedAt: serverTimestamp()}));
                    await withSaveStatus(batch.commit());
                },
                toggleExcellence: async (did, d, exists) => {
                    if(isOffline){ 
                        let n; if(exists) n=excellenceRecords.filter(r=>`${r.date}_${r.subject}_${r.studentId}`!==did && r.id!==did); else n=[...excellenceRecords,{...d,id:did}]; 
                        setExcellenceRecords(n); localStorage.setItem('excellence',JSON.stringify(n)); return; 
                    }
                    const {db,doc,setDoc,deleteDoc,serverTimestamp} = window.AppFirebase; 
                    const ref = doc(db,'artifacts',appId,'public','data','excellence',did); 
                    if(exists) await withSaveStatus(deleteDoc(ref)); else await withSaveStatus(setDoc(ref, {...d, createdAt: serverTimestamp()}));
                },
                toggleQuizStatus: async (quiz) => {
                    const current = quizWindows?.[quiz]?.isOpen || false;
                    const newWindows = { ...quizWindows, [quiz]: { isOpen: !current } };
                    setQuizWindows(newWindows);
                    if (isOffline) { localStorage.setItem('quizWindows', JSON.stringify(newWindows)); return; }
                    const { db, doc, setDoc } = window.AppFirebase;
                    await withSaveStatus(setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'config'), { quizWindows: newWindows }, { merge: true }));
                },
                toggleExcellenceLock: async () => {
                    const newVal = !isExcellenceLocked;
                    setIsExcellenceLocked(newVal);
                    if (isOffline) { localStorage.setItem('excellenceLocked', JSON.stringify(newVal)); return; }
                    const { db, doc, setDoc } = window.AppFirebase;
                    await withSaveStatus(setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'config'), { excellenceLocked: newVal }, { merge: true }));
                },
                addTeacher: async (t) => {
                    if(isOffline) return alert("غير متاح في الوضع المحلي");
                    const {db,doc,setDoc,serverTimestamp} = window.AppFirebase; 
                    await withSaveStatus(setDoc(doc(db,'artifacts',appId,'public','data','teachers', t.id), {...t, createdAt: serverTimestamp()}));
                },
                batchAddTeachers: async (list) => {
                    if(isOffline) return alert("غير متاح في الوضع المحلي");
                    const {db,doc,writeBatch,serverTimestamp} = window.AppFirebase;
                    const batch = writeBatch(db);
                    list.forEach(t => batch.set(doc(db,'artifacts',appId,'public','data','teachers', t.id), { id: t.id, name: t.name, createdAt: serverTimestamp() }));
                    await withSaveStatus(batch.commit());
                },
                deleteTeacher: async (id) => {
                    if(isOffline) return;
                    const {db,doc,deleteDoc} = window.AppFirebase; 
                    await withSaveStatus(deleteDoc(doc(db,'artifacts',appId,'public','data','teachers', id)));
                },
                batchDeleteTeachers: async (list) => {
                     if(isOffline) return;
                     const {db,doc,writeBatch} = window.AppFirebase;
                     const batch = writeBatch(db);
                     list.forEach(t => batch.delete(doc(db,'artifacts',appId,'public','data','teachers', t.id)));
                     await withSaveStatus(batch.commit());
                }
            };

            if (!firebaseReady || (user && loading)) return <div className="min-h-screen flex items-center justify-center bg-slate-100 text-slate-500 gap-3"><div className="animate-spin rounded-full h-8 w-8 border-b-2 border-emerald-600"></div><span>جاري التحميل...</span></div>;
            if (!userRole) return <LoginScreen onLogin={handleLogin} onTeacherLogin={handleTeacherLogin} newsText={newsText}/>;

            return (
                <div className="flex flex-col md:flex-row min-h-screen bg-slate-50 font-sans print:block print:h-auto print:overflow-visible print:bg-white" dir="rtl">
                    <Sidebar activeTab={activeTab} setActiveTab={setActiveTab} userRole={userRole} onLogout={handleLogout} dbError={dbError} studentsCount={students.length} />
                    <main className="flex-1 p-4 md:p-8 overflow-y-auto h-screen relative flex flex-col print:h-auto print:overflow-visible print:block print:p-0">
                        <div className="absolute top-4 left-4 z-50 flex gap-2 print:hidden">
                            {saveStatus === 'saving' && <span className="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1 animate-pulse"><Icon name="UploadCloud" size={14}/> جاري الحفظ...</span>}
                            {saveStatus === 'success' && <span className="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1"><Icon name="CheckCircle" size={14}/> تم الحفظ بنجاح</span>}
                            {saveStatus === 'error' && <span className="bg-red-100 text-red-700 px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1"><Icon name="XCircle" size={14}/> فشل الحفظ</span>}
                        </div>

                        {authError && <div className="mb-4 p-3 bg-amber-50 border border-amber-200 rounded text-amber-800 text-sm font-bold print:hidden">{authError}</div>}
                        {dbError && <div className="mb-4 p-3 bg-red-50 border border-red-200 rounded text-red-800 text-sm font-bold print:hidden">{dbError}</div>}

                        <NewsTicker text={newsText} />
                        <div className="max-w-6xl mx-auto flex-1 w-full mt-4 print:mt-0 print:max-w-none">
                            {activeTab === 'dashboard' && userRole === 'admin' && <DashboardView students={students} attendanceRecords={attendanceRecords} newsText={newsText} actions={actions} isExcellenceLocked={isExcellenceLocked} quizWindows={quizWindows} whatsappTemplates={whatsappTemplates} />}
                            {activeTab === 'students' && userRole === 'admin' && <StudentsView students={students} actions={actions} />} 
                            {activeTab === 'attendance' && <AttendanceView students={students} attendanceRecords={attendanceRecords} userRole={userRole} teacherState={teacherState} setTeacherState={setTeacherState} actions={actions} />}
                            {activeTab === 'excellence' && <ExcellenceView students={students} userRole={userRole} teacherState={teacherState} setTeacherState={setTeacherState} excellenceRecords={excellenceRecords} actions={actions} isExcellenceLocked={isExcellenceLocked} quizWindows={quizWindows} />}
                            {activeTab === 'reports' && userRole === 'admin' && <ReportsView students={students} attendanceRecords={attendanceRecords} excellenceRecords={excellenceRecords} actions={actions} whatsappTemplates={whatsappTemplates} />}
                            {activeTab === 'teachers' && userRole === 'admin' && <TeachersManagerView teachers={teachers} actions={actions} />}
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SchoolAttendanceApp />);
    </script>
</body>
</html>
